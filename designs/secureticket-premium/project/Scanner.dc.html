<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Quét vé</title><script src="./support.js"></script></head>
<body><x-dc><helmet><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>body{margin:0;background:#09101e;font-family:Manrope,system-ui,sans-serif;color:white}*{box-sizing:border-box}a{color:inherit;text-decoration:none}button{font:inherit}.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}header{background:rgba(8,15,27,.38);border-bottom:1px solid rgba(255,255,255,.1);box-shadow:0 18px 45px rgba(0,0,0,.16);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}</style></helmet>
<div style="width:390px;height:844px;background:#09101e;display:flex;flex-direction:column;overflow:hidden;position:relative">
  <div style="height:28px;display:flex;align-items:end;justify-content:space-between;padding:0 22px 4px;font-size:11px;font-weight:700;position:relative;z-index:3"><span>20:04</span><span>5G ▰</span></div>
  <div style="position:absolute;inset:0;background:radial-gradient(circle at 72% 24%,#365273 0,#1b304a 23%,#111e31 47%,#080e19 78%)"></div>
  <div style="position:absolute;inset:0;opacity:.22;background-image:linear-gradient(115deg,transparent 0 42%,rgba(135,180,201,.28) 43% 54%,transparent 55%),linear-gradient(25deg,transparent 0 55%,rgba(255,255,255,.16) 56% 62%,transparent 63%)"></div>
  <header style="height:67px;padding:9px 15px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:3"><a href="Main.dc.html" aria-label="Đóng máy quét" style="width:46px;height:46px;border-radius:16px;background:rgba(10,18,32,.62);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></a><div style="text-align:center"><div style="font-size:14px;font-weight:800">Quét vé</div><div style="font-size:9px;color:#bdc9d9;margin-top:2px">Xác thực QR động</div></div><button onClick="{{toggleFlash}}" aria-label="Bật tắt đèn flash" style="width:46px;height:46px;border:0;border-radius:16px;background:{{flashBg}};color:{{flashColor}};display:flex;align-items:center;justify-content:center"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m13 2-8 12h7l-1 8 8-12h-7l1-8Z"></path></svg></button></header>
  <main style="flex:1;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:28px 25px 22px"><div style="font-size:12px;color:#e7edf6;font-weight:600;text-align:center">Đưa mã QR vào trong khung</div><div style="font-size:9px;color:#9daabc;margin-top:5px">Mã sẽ được nhận diện tự động</div>
    <button onClick="{{scan}}" aria-label="Mô phỏng quét mã QR" style="width:278px;height:278px;margin-top:42px;border:0;background:transparent;position:relative;padding:0"><span style="position:absolute;left:0;top:0;width:66px;height:66px;border-left:4px solid {{frameColor}};border-top:4px solid {{frameColor}};border-radius:22px 0 0 0"></span><span style="position:absolute;right:0;top:0;width:66px;height:66px;border-right:4px solid {{frameColor}};border-top:4px solid {{frameColor}};border-radius:0 22px 0 0"></span><span style="position:absolute;left:0;bottom:0;width:66px;height:66px;border-left:4px solid {{frameColor}};border-bottom:4px solid {{frameColor}};border-radius:0 0 0 22px"></span><span style="position:absolute;right:0;bottom:0;width:66px;height:66px;border-right:4px solid {{frameColor}};border-bottom:4px solid {{frameColor}};border-radius:0 0 22px 0"></span><span style="position:absolute;left:16px;right:16px;top:{{scanTop}};height:2px;background:{{scanLine}};box-shadow:0 0 14px {{scanLine}}"></span><span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:138px;height:138px;opacity:.22;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px"><sc-for list="{{qrCells}}" as="cell" hint-placeholder-count="30"><span style="background:{{cell.color}};border-radius:2px"></span></sc-for></span></button>
    <sc-if value="{{isIdle}}" hint-placeholder-val="{{ true }}"><div style="margin-top:28px;display:flex;align-items:center;gap:8px;color:#cbd5e1;font-size:10px;font-weight:700"><span style="width:7px;height:7px;background:#6b8cff;border-radius:50%;box-shadow:0 0 0 5px rgba(107,140,255,.16)"></span>Camera đang hoạt động</div></sc-if>
    <sc-if value="{{isSuccess}}" hint-placeholder-val="{{ false }}"><div style="margin-top:22px;background:rgba(20,111,91,.88);border:1px solid rgba(110,232,200,.42);border-radius:18px;padding:13px 15px;width:100%;display:flex;align-items:center;gap:11px"><span style="width:38px;height:38px;border-radius:50%;background:#6ee8c8;color:#0b4a3e;display:flex;align-items:center;justify-content:center"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"></path></svg></span><span><strong style="font-size:11px;display:block">Vé hợp lệ</strong><small style="font-size:9px;color:#c9f8eb;display:block;margin-top:3px">SecureFest · Nguyễn Minh Anh</small></span></div></sc-if>
    <div style="margin-top:auto;background:rgba(8,15,27,.62);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:5px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:245px"><button onClick="{{qrMode}}" style="height:43px;border:0;border-radius:14px;background:{{qrBg}};color:{{qrColor}};font-size:10px;font-weight:800">QR Camera</button><button onClick="{{nfcMode}}" style="height:43px;border:0;border-radius:14px;background:{{nfcBg}};color:{{nfcColor}};font-size:10px;font-weight:800">NFC</button></div>
  </main>
  <sc-if value="{{isNfc}}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:95px 0 0;background:rgba(8,15,27,.92);backdrop-filter:blur(18px);z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center"><button onClick="{{qrMode}}" aria-label="Đóng NFC" style="position:absolute;top:18px;right:18px;width:44px;height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.1);color:white;font-size:20px">×</button><span style="width:96px;height:96px;border-radius:32px;background:#273f9a;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 18px rgba(75,105,211,.12)"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" style="width:44px;height:44px"><path d="M8 6a7 7 0 0 1 0 12M11 3a11 11 0 0 1 0 18M5 9a3 3 0 0 1 0 6"></path></svg></span><h2 style="font-size:20px;margin:38px 0 8px">Sẵn sàng quét NFC</h2><p style="font-size:11px;line-height:1.6;color:#b9c5d5;margin:0">Đưa thiết bị của khách đến gần điện thoại để bắt đầu xác thực challenge-response.</p><button onClick="{{qrMode}}" style="height:48px;padding:0 25px;margin-top:30px;border:0;border-radius:16px;background:#fff;color:#203e9a;font-weight:800">Quay lại camera</button></div></sc-if>
</div></x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>class Component extends DCLogic{constructor(props){super(props);this.state={flash:false,status:'idle',mode:'qr',line:22}}renderVals(){let success=this.state.status==='success',nfc=this.state.mode==='nfc';return{flashBg:this.state.flash?'#FFF2B8':'rgba(10,18,32,.62)',flashColor:this.state.flash?'#805F00':'#FFFFFF',toggleFlash:()=>this.setState({flash:!this.state.flash}),scan:()=>this.setState({status:success?'idle':'success',line:success?22:75}),isIdle:!success,isSuccess:success,frameColor:success?'#6EE8C8':'#8BA7FF',scanTop:this.state.line+'%',scanLine:success?'#6EE8C8':'#8BA7FF',qrCells:Array.from({length:49},(_,i)=>({color:(i*7)%13<6?'#D9E5F4':'transparent'})),isNfc:nfc,qrMode:()=>this.setState({mode:'qr'}),nfcMode:()=>this.setState({mode:'nfc'}),qrBg:nfc?'transparent':'#FFFFFF',qrColor:nfc?'#AEBACC':'#203E9A',nfcBg:nfc?'#FFFFFF':'transparent',nfcColor:nfc?'#203E9A':'#AEBACC'}}}</script></body></html>
